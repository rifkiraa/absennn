<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Sistem Absensi Karyawan Berbasis Website Mobile-First CV Mandala Mahardika" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Mandala Absensi" />
  <title>Sistem Absensi — CV Mandala Mahardika</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#2563EB',
              dark: '#1D4ED8',
              light: '#3B82F6',
              50: '#EFF6FF',
              100: '#DBEAFE',
              500: '#2563EB',
              600: '#1D4ED8',
              700: '#1E40AF',
            },
            brand: {
              bg: '#F5F8FF',
              surface: '#FFFFFF',
              text: '#0F172A',
              muted: '#64748B',
              border: '#E2E8F0',
            },
            status: {
              success: '#16A34A',
              warning: '#D97706',
              danger: '#DC2626',
              info: '#2563EB',
            }
          },
          borderRadius: {
            'card': '16px',
            'control': '12px',
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          boxShadow: {
            'xs': '0 1px 2px 0 rgba(15, 23, 42, 0.04)',
            'subtle': '0 1px 3px 0 rgba(15, 23, 42, 0.05), 0 1px 2px 0 rgba(15, 23, 42, 0.03)',
            'card': '0 4px 6px -1px rgba(15, 23, 42, 0.05), 0 2px 4px -1px rgba(15, 23, 42, 0.03)',
            'float': '0 10px 15px -3px rgba(37, 99, 235, 0.1), 0 4px 6px -2px rgba(37, 99, 235, 0.05)',
          }
        }
      }
    };
  </script>

  <style>
    :root {
      --primary: #2563EB;
      --primary-dark: #1D4ED8;
      --brand-bg: #F5F8FF;
      --brand-surface: #FFFFFF;
      --brand-text: #0F172A;
      --brand-muted: #64748B;
      --brand-border: #E2E8F0;
    }

    body {
      background-color: var(--brand-bg);
      color: var(--brand-text);
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    button, a, input, select {
      touch-action: manipulation;
    }

    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s ease-out forwards;
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-slideUp {
      animation: slideUp 0.25s ease-out forwards;
    }

    /* Aturan Cetak / Print ke PDF Resmi A4 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 1.2cm;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
        font-size: 11pt !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }
      header, aside, nav, .no-print, button, [role="navigation"], #toast-container {
        display: none !important;
      }
      #printable-report-area {
        display: block !important;
        position: static !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
        box-shadow: none !important;
        border: none !important;
        background: transparent !important;
      }
    }
  </style>
</head>
<body class="bg-brand-bg text-brand-text font-sans antialiased min-h-screen">
  <!-- Root Aplikasi -->
  <div id="app-root" class="min-h-screen flex flex-col"></div>

  <!-- Container Modal Global -->
  <div id="modal-root"></div>

  <!-- Container Toast Notifikasi -->
  <div id="toast-container"></div>

  <!-- Script Modular Aplikasi (Urutan Wajib) -->
  <script src="./core.js"></script>
  <script src="./pages-auth-dashboard.js"></script>
  <script src="./pages-management.js"></script>
</body>
</html>
